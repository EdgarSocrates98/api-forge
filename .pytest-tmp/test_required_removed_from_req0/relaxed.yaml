openapi: 3.1.0
info: {title: x, version: '2'}
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Order'}
      responses: {'201': {description: ok}}
components:
  schemas:
    Order:
      type: object
      required: [id]
      properties: {id: {type: string}, total: {type: number}, note: {type: string}}
