id: openapi-add-query-param
protocol: openapi
expected: compatible
holdout: true
outcome: evaluate openapi add query param
mutants:
- add_required_request_property
baseline:
  openapi: 3.1.0
  info:
    title: Orders API
    version: 1.0.0
  paths:
    /orders:
      get:
        operationId: listOrders
        responses:
          '200':
            description: List orders
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Order'
      post:
        operationId: createOrder
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        responses:
          '200':
            description: Order created (sync)
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Order'
          '201':
            description: Order created
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Order'
  components:
    schemas:
      Order:
        type: object
        required:
        - id
        - total
        properties:
          id:
            type: string
          total:
            type: number
          note:
            type: string
