version: 1
runtime:
  default_policy: local-ci-safe
  profiles_file: agent_profiles.yaml
  resume:
    reuse_completed: true
    require_idempotency_key: true
    legacy_without_control: review
  eval_gate:
    required_kinds: [golden, holdout, mutation, adversarial]
    block_on_missing_evidence: true
  routing_evolution:
    active_wave: 0
    mode: local
    promotion: evidence_gated
    fallback: static-routing
    allow_external_mutation: false
    require_rollback_ref: true
    unknown_evidence: unresolved
    adaptive_plan:
      enabled: false
      max_steps: null
  routing:
    policy_version: routing/v1
    objective_order: [efficiency, quality]
    security_mode: gate
    unknown_signal: unresolved
    tie_breaker: capability
    scorecard_update: eval_required
    execution_mode: parallel_review
    max_fallbacks: 1
    risk_complexity:
      policy_version: risk-complexity/v1
      unknown_behavior: unresolved
      risk_overrides:
        sensitive: complex
        external_mutation: critical
        destructive: critical
        irreversible: critical
      ordered_rules:
        - rule_id: missing-required-evidence
          when: required_evidence_unavailable
          complexity: critical
        - rule_id: missing-required-expertise
          when: required_expertise_unavailable
          complexity: complex
        - rule_id: large-task
          when: size_is_L
          complexity: complex
        - rule_id: medium-task
          when: size_is_M
          complexity: moderate
        - rule_id: dependencies-present
          when: dependencies_present
          complexity: moderate
        - rule_id: expected-proofs-present
          when: expected_proofs_present
          complexity: moderate
        - rule_id: verification-strategy
          when: strategy_requires_verification
          complexity: moderate
      effects:
        simple:
          objective_order: [efficiency, quality]
          verification_depth: standard
          required_roles: []
        moderate:
          objective_order: [quality, efficiency]
          verification_depth: elevated
          required_roles: [reviewer]
        complex:
          objective_order: [quality, efficiency]
          verification_depth: strict
          required_roles: [reviewer, critic]
        critical:
          objective_order: [quality]
          verification_depth: strict
          required_roles: [reviewer, critic, referee]
  healing:
    rollback_mode: cas_strict
  policies:
    local-ci-safe:
      max_parallel_agents: 4
      max_calls: 20
      max_rounds: 3
      timeout_seconds: 120
      max_retries: 2
      allow_external_mutation: false
      critic_risks: [sensitive, external_mutation, destructive, irreversible]
      human_gate_reasons: [external_mutation, destructive, irreversible, unresolved_debate, low_confidence]
      debate_triggers: [conflicting_evidence, high_risk, low_confidence, user_requested]
      adapter: fake
      replay_normalize: true
      redact_sensitive: true
  capabilities:
    api-contract-review:
      agent: api-contract-architect
      kind: specialist
      family: api-contract-review
      implementation: contract
      risk: read_only
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
    api-security-review:
      agent: api-security-reviewer
      kind: specialist
      risk: sensitive
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
    api-performance-review:
      agent: api-performance-engineer
      kind: specialist
      risk: read_only
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
    api-data-review:
      agent: api-data-access-architect
      kind: specialist
      risk: sensitive
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
    api-architecture-review:
      agent: api-architecture-reviewer
      kind: specialist
      family: api-contract-review
      implementation: architecture
      risk: read_only
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
    adversarial-critic:
      agent: api-adversarial-critic
      kind: critic
      risk: sensitive
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
    task-review:
      agent: api-task-spec-reviewer
      kind: reviewer
      risk: read_only
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
    debate-referee:
      agent: api-debate-referee
      kind: referee
      risk: sensitive
      state: supported
      evidence: [task_spec]
      prerequisites: [task_spec]
