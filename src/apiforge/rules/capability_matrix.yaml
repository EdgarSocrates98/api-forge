capabilities:
  api.analyze:
    vertical: api
    operation: analyze
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [case_manifest, facts, findings, smoke_test]
    limitations:
      - static adapters do not execute application code
      - dynamic routes remain unresolved
    prerequisites: [OpenAPI 3.1 contract, supported project adapter]
    risk: read_only
    rollback: delete generated local case only
    verifier: tests/e2e/test_platform_completion.py::test_platform_chain
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: local-static
  api.next-step:
    vertical: api
    operation: next-step
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [findings_json, routing_catalog, routing_test]
    limitations:
      - routing requires findings mapped to the catalog
    prerequisites: [official findings envelope]
    risk: read_only
    rollback: no external state
    verifier: tests/e2e/test_next_step.py
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: deterministic-routing
  api.provenance:
    vertical: api
    operation: graph-evidence-brief
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [case_manifest, artifact_hashes, graph_export, receipt]
    limitations:
      - brief acceptance still requires an independent task verification record
    prerequisites: [integrity-checked case]
    risk: read_only
    rollback: preserve previous receipt and graph
    verifier: tests/e2e/test_platform_completion.py::test_platform_chain
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: local-evidence
  database.inspect:
    vertical: database
    operation: inspect-access-patterns
    state: heuristic
    surfaces: [cli, mcp, ide, ui]
    evidence: [source_fixture, access_ir, holdout]
    limitations:
      - indexes, cardinality and query plans require database evidence
    prerequisites: [source code or read-only database report]
    risk: read_only
    rollback: no external state
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: static-data-access
  database.verify-runtime:
    vertical: database
    operation: verify-local-runtime
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [allowlisted_probe, runtime_receipt, sqlite_execution]
    limitations:
      - proves the committed local SQLite fixture, not a remote engine or production query plan
    prerequisites: [repository fixtures, local Python runtime]
    risk: read_only
    rollback: no external state
    verifier: tests/application/test_platform_runtime.py::test_all_platform_vertical_probes_execute_and_emit_receipt
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: local-runtime-probe
  messaging.inspect:
    vertical: messaging
    operation: inspect-topology
    state: heuristic
    surfaces: [cli, mcp, ide, ui]
    evidence: [asyncapi_or_source, messaging_ir, holdout]
    limitations:
      - lag, backlog and delivery guarantees require broker observations
    prerequisites: [AsyncAPI, source fixture or read-only broker report]
    risk: read_only
    rollback: no external state
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: static-messaging
  messaging.verify-runtime:
    vertical: messaging
    operation: verify-local-runtime
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [allowlisted_probe, runtime_receipt, acknowledgement_execution]
    limitations:
      - proves the committed local message flow, not broker lag, ordering or delivery guarantees
    prerequisites: [repository fixtures, local Python runtime]
    risk: read_only
    rollback: no external state
    verifier: tests/application/test_platform_runtime.py::test_all_platform_vertical_probes_execute_and_emit_receipt
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: local-runtime-probe
  cicd.inspect:
    vertical: cicd
    operation: inspect-pipeline
    state: heuristic
    surfaces: [cli, mcp, ide, ui]
    evidence: [pipeline_fixture, report_fixture, holdout]
    limitations:
      - provider execution status is not inferred from configuration alone
    prerequisites: [pipeline definition or CI report]
    risk: read_only
    rollback: no external state
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: static-cicd
  cicd.verify-runtime:
    vertical: cicd
    operation: verify-local-pipeline
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [allowlisted_probe, runtime_receipt, pipeline_execution]
    limitations:
      - proves the committed pipeline manifest rehearsal, not a provider's hosted execution
    prerequisites: [repository fixtures, local Python runtime]
    risk: read_only
    rollback: no external state
    verifier: tests/application/test_platform_runtime.py::test_all_platform_vertical_probes_execute_and_emit_receipt
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: local-runtime-probe
  cloud.inspect:
    vertical: cloud
    operation: inspect-infrastructure
    state: heuristic
    surfaces: [cli, mcp, ide, ui]
    evidence: [iac_fixture, posture_dump, holdout]
    limitations:
      - variables, remote state and live posture remain unresolved without evidence
    prerequisites: [Terraform/SAM or read-only posture dump]
    risk: read_only
    rollback: no external state
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: static-cloud
  cloud.verify-runtime:
    vertical: cloud
    operation: verify-local-iac-runtime
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [allowlisted_probe, runtime_receipt, hcl_execution]
    limitations:
      - proves local IaC parsing and declared resources, not cloud apply or remote posture
    prerequisites: [Terraform fixture, local HCL parser]
    risk: read_only
    rollback: no external state
    verifier: tests/application/test_platform_runtime.py::test_all_platform_vertical_probes_execute_and_emit_receipt
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: local-runtime-probe
  frontend.inspect:
    vertical: frontend
    operation: inspect-api-integration
    state: heuristic
    surfaces: [cli, mcp, ide, ui]
    evidence: [package_manifest, source_fixture, holdout]
    limitations:
      - browser runtime behavior and accessibility require a frontend test host
    prerequisites: [front-end project and API contract]
    risk: read_only
    rollback: no external state
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: static-frontend
  frontend.verify-runtime:
    vertical: frontend
    operation: verify-local-integration
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [allowlisted_probe, runtime_receipt, typed_fetch_contract]
    limitations:
      - proves the committed integration fixture, not a browser engine or accessibility audit
    prerequisites: [frontend fixture, local Python runtime]
    risk: read_only
    rollback: no external state
    verifier: tests/application/test_platform_runtime.py::test_all_platform_vertical_probes_execute_and_emit_receipt
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: local-runtime-probe
  git.plan:
    vertical: integration
    operation: plan-git-change
    state: unresolved
    surfaces: [cli, mcp, ide, ui]
    evidence: [worktree, diff, policy]
    limitations:
      - no Git host mutation is enabled by the local core
    prerequisites: [worktree, policy and rollback plan]
    risk: local_reversible
    rollback: restore sandbox or worktree through the host policy
    verifier: tests/runtime/test_supervisor.py
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: integration-gateway
  api.change-control:
    vertical: api
    operation: govern-api-git-cicd-change
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [change_bundle, collection_receipt, case_manifest, next_step, graph_export, receipt, outcome_brief, junit, markdown, ide_projection, ui_host]
    limitations:
      - provider observations are read-only and do not prove deployment success
      - live GitHub evidence is a time-bound observation and requires an explicit read-only transport and policy
    prerequisites: [af-change-bundle/1, OpenAPI 3.1 contract, supported project adapter]
    risk: read_only
    rollback: delete the local governed output directory only
    verifier: tests/e2e/test_api_git_cicd_change_control.py::test_change_control_flow
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: artifact-replay
  git.read-context:
    vertical: integration
    operation: read-git-provider-context
    state: heuristic
    surfaces: [cli, mcp, ide, ui]
    evidence: [github_read_only_adapter, transport_contract, replay_fixture]
    limitations:
      - provider availability, permissions and freshness remain unresolved without a live evidence receipt
      - no merge, push, workflow dispatch or deployment mutation is available
    prerequisites: [read-only transport, repository ref and policy]
    risk: read_only
    rollback: no external state
    verifier: tests/integrations/test_github_adapter.py
    documentation: docs/security/api-git-cicd-control-plane.md
    adapter: github-read-only
  integration.github-issues:
    vertical: integration
    operation: read-issue-tracker-context
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [github_issues_get, external_read_receipt]
    limitations:
      - issue state and permissions are observations at collection time, not mutation authorization
    prerequisites: [GET-only host transport, repository reference, optional read token]
    risk: read_only
    rollback: no external state
    verifier: tests/integrations/test_external_read_adapters.py::test_github_issues_adapter_is_get_only_and_emits_receipt
    documentation: docs/guides/API_FORGE_PLATFORM_USAGE.md
    adapter: github-issues-read-only
  integration.health:
    vertical: integration
    operation: read-remote-health
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [health_get, external_read_receipt, freshness_verification]
    limitations:
      - a health endpoint cannot prove SLO compliance, rollback readiness or application correctness
    prerequisites: [absolute HTTP(S) URL, read-only network access]
    risk: read_only
    rollback: no external state
    verifier: tests/integrations/test_external_read_adapters.py::test_health_receipt_has_reproducible_freshness_verification
    documentation: docs/guides/API_FORGE_PLATFORM_USAGE.md
    adapter: http-health-read-only
  integration.json-read:
    vertical: integration
    operation: read-external-json
    state: supported
    surfaces: [cli, mcp, ide, ui]
    evidence: [json_get, external_read_receipt]
    limitations:
      - provider-specific issue and permission semantics are not inferred from generic JSON
    prerequisites: [absolute HTTP(S) URL, read-only host credential when required]
    risk: read_only
    rollback: no external state
    verifier: tests/integrations/test_external_read_adapters.py::test_generic_json_adapter_preserves_external_payload_without_inference
    documentation: docs/guides/API_FORGE_PLATFORM_USAGE.md
    adapter: http-json-read-only
  cicd.inspect-run:
    vertical: cicd
    operation: inspect-ci-observations
    state: heuristic
    surfaces: [cli, mcp, ide, ui]
    evidence: [check_run_observation, change_metrics, holdout]
    limitations:
      - configuration and check observations do not prove deployment safety or runtime health
    prerequisites: [change bundle or provider read-only adapter]
    risk: read_only
    rollback: no external state
    verifier: tests/observability/test_change_metrics.py
    documentation: docs/guides/API_FORGE_PLATFORM_USAGE.md
    adapter: github-read-only
  external.apply:
    vertical: integration
    operation: apply-external-change
    state: unsupported
    surfaces: [cli, mcp, ide, ui]
    evidence: [approval_gate, adapter_receipt, rollback, independent_verification]
    limitations:
      - live mutation is not available in the offline core
    prerequisites: [explicit adapter, policy approval, rollback and receipt]
    risk: external_mutation
    rollback: provider-specific rollback is mandatory
    verifier: tests/runtime/test_supervisor.py
    documentation: docs/capabilities/API_FORGE_CAPABILITY_MATRIX.md
    adapter: none
verticals:
  - vertical: api
    fixture: tests/fixtures/platform/api
    golden: tests/fixtures/platform/api/golden.json
    holdout: tests/fixtures/platform/api/holdout.yaml
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
  - vertical: database
    fixture: tests/fixtures/platform/database
    golden: tests/fixtures/platform/database/golden.json
    holdout: tests/fixtures/platform/database/holdout.yaml
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
  - vertical: messaging
    fixture: tests/fixtures/platform/messaging
    golden: tests/fixtures/platform/messaging/golden.json
    holdout: tests/fixtures/platform/messaging/holdout.yaml
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
  - vertical: cicd
    fixture: tests/fixtures/platform/cicd
    golden: tests/fixtures/platform/cicd/golden.json
    holdout: tests/fixtures/platform/cicd/holdout.yaml
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
  - vertical: cloud
    fixture: tests/fixtures/platform/cloud
    golden: tests/fixtures/platform/cloud/golden.json
    holdout: tests/fixtures/platform/cloud/holdout.yaml
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
  - vertical: frontend
    fixture: tests/fixtures/platform/frontend
    golden: tests/fixtures/platform/frontend/golden.json
    holdout: tests/fixtures/platform/frontend/holdout.yaml
    verifier: tests/labs/test_platform_verticals.py::test_vertical_coverage
  - vertical: api-git-cicd
    fixture: tests/fixtures/api_git_cicd/change_bundle.json
    golden: tests/fixtures/api_git_cicd/golden.json
    holdout: tests/fixtures/api_git_cicd/holdout.yaml
