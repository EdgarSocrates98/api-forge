area: DATA
rules:
  - id: AF-DATA-001
    title: "KEYS command scans the whole keyspace"
    severity: high
    rationale: >
      KEYS is O(N) over every key in the database and blocks the Redis event
      loop while it runs; on a hot instance this stalls all clients.
    remediation: >
      Replace with SCAN (cursor-based, incremental) or maintain an explicit
      index set; never call KEYS on a hot path.
    reference: "https://redis.io/docs/latest/commands/keys/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: keys
  - id: AF-DATA-002
    title: "Write without a visible TTL"
    severity: medium
    rationale: >
      A write with no expiry accumulates keys forever; memory grows until
      eviction policy or OOM decides. The rule fires only when no ttl is
      visible in the call — a TTL set elsewhere is named, not assumed.
    remediation: "Pass ex=/px=/setex with an explicit ttl, or document why the key is permanent."
    reference: "https://redis.io/docs/latest/commands/set/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.write
      path: measures.ttl_seconds
      op: absent
  - id: AF-DATA-003
    title: "FLUSHALL drops every database"
    severity: critical
    rationale: "FLUSHALL deletes all keys in all databases — catastrophic on a shared instance."
    remediation: "Remove the call; if a reset is required, scope it to FLUSHDB on a dedicated db under an explicit runbook."
    reference: "https://redis.io/docs/latest/commands/flushall/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: flushall
  - id: AF-DATA-004
    title: "FLUSHDB drops the current database"
    severity: high
    rationale: "FLUSHDB deletes every key in the selected database — destructive outside maintenance windows."
    remediation: "Remove or gate behind an explicit operational runbook."
    reference: "https://redis.io/docs/latest/commands/flushdb/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: flushdb
  - id: AF-DATA-005
    title: "CONFIG rewrites server behavior at runtime"
    severity: high
    rationale: "CONFIG SET changes server parameters live; from application code it is almost never legitimate and is commonly disabled in managed offerings."
    remediation: "Move configuration to deployment-time config management; drop runtime CONFIG calls."
    reference: "https://redis.io/docs/latest/commands/config-set/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: config
  - id: AF-DATA-006
    title: "DEBUG is an unsafe introspection command"
    severity: high
    rationale: "DEBUG subcommands (SEGFAULT, SLEEP, JMAP) exist for Redis development; several are disabled in production builds and all are unsafe from application code."
    remediation: "Remove DEBUG calls from application code."
    reference: "https://redis.io/docs/latest/commands/debug/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: debug
  - id: AF-DATA-007
    title: "MONITOR streams every command"
    severity: medium
    rationale: "MONITOR mirrors every command the server executes to the caller — a heavy cost and an information leak if bound on a hot path."
    remediation: "Use MONITOR only from an operator session during diagnosis; never from application code."
    reference: "https://redis.io/docs/latest/commands/monitor/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: monitor
  - id: AF-DATA-008
    title: "SAVE blocks the server synchronously"
    severity: high
    rationale: "SAVE performs a synchronous point-in-time snapshot, blocking all clients; BGSAVE exists for the non-blocking form."
    remediation: "Use BGSAVE or rely on configured persistence; never call SAVE from a request path."
    reference: "https://redis.io/docs/latest/commands/save/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: save
