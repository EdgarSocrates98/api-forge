area: DATA
rules:
  - id: AF-DATA-001
    title: "KEYS command scans the whole keyspace"
    severity: high
    rationale: >
      KEYS is O(N) over every key in the database and blocks the Redis event
      loop while it runs; on a hot instance this stalls all clients.
    remediation: >
      Replace with SCAN (cursor-based, incremental) or maintain an explicit
      index set; never call KEYS on a hot path.
    reference: "https://redis.io/docs/latest/commands/keys/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: keys
  - id: AF-DATA-002
    title: "Write without a visible TTL"
    severity: medium
    rationale: >
      A write with no expiry accumulates keys forever; memory grows until
      eviction policy or OOM decides. The rule fires only when no ttl is
      visible in the call — a TTL set elsewhere is named, not assumed.
    remediation: "Pass ex=/px=/setex with an explicit ttl, or document why the key is permanent."
    reference: "https://redis.io/docs/latest/commands/set/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.write
      path: measures.ttl_seconds
      op: absent
  - id: AF-DATA-003
    title: "FLUSHALL drops every database"
    severity: critical
    rationale: "FLUSHALL deletes all keys in all databases — catastrophic on a shared instance."
    remediation: "Remove the call; if a reset is required, scope it to FLUSHDB on a dedicated db under an explicit runbook."
    reference: "https://redis.io/docs/latest/commands/flushall/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: flushall
  - id: AF-DATA-004
    title: "FLUSHDB drops the current database"
    severity: high
    rationale: "FLUSHDB deletes every key in the selected database — destructive outside maintenance windows."
    remediation: "Remove or gate behind an explicit operational runbook."
    reference: "https://redis.io/docs/latest/commands/flushdb/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: flushdb
  - id: AF-DATA-005
    title: "CONFIG rewrites server behavior at runtime"
    severity: high
    rationale: "CONFIG SET changes server parameters live; from application code it is almost never legitimate and is commonly disabled in managed offerings."
    remediation: "Move configuration to deployment-time config management; drop runtime CONFIG calls."
    reference: "https://redis.io/docs/latest/commands/config-set/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: config
  - id: AF-DATA-006
    title: "DEBUG is an unsafe introspection command"
    severity: high
    rationale: "DEBUG subcommands (SEGFAULT, SLEEP, JMAP) exist for Redis development; several are disabled in production builds and all are unsafe from application code."
    remediation: "Remove DEBUG calls from application code."
    reference: "https://redis.io/docs/latest/commands/debug/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: debug
  - id: AF-DATA-007
    title: "MONITOR streams every command"
    severity: medium
    rationale: "MONITOR mirrors every command the server executes to the caller — a heavy cost and an information leak if bound on a hot path."
    remediation: "Use MONITOR only from an operator session during diagnosis; never from application code."
    reference: "https://redis.io/docs/latest/commands/monitor/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: monitor
  - id: AF-DATA-008
    title: "SAVE blocks the server synchronously"
    severity: high
    rationale: "SAVE performs a synchronous point-in-time snapshot, blocking all clients; BGSAVE exists for the non-blocking form."
    remediation: "Use BGSAVE or rely on configured persistence; never call SAVE from a request path."
    reference: "https://redis.io/docs/latest/commands/save/"
    runtime_scope: "redis|valkey"
    check:
      kind: data.redis.command
      path: measures.command
      op: eq
      value: save
  - id: AF-DATA-009
    title: "DynamoDB Scan without limit or filter"
    severity: high
    rationale: >
      Scan reads every item in the table before filtering — RCU cost and
      latency grow with table size, not with the result set. The call site
      shows no Limit, FilterExpression or IndexName argument.
    remediation: "Prefer Query on a key condition; if Scan is required, bound it with Limit and a FilterExpression, and keep it off request paths."
    reference: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Scan.html"
    runtime_scope: "dynamodb"
    check:
      kind: data.dynamo.operation
      path: measures.full_scan
      op: eq
      value: true
  - id: AF-DATA-010
    title: "DynamoDB Query without a key condition"
    severity: medium
    rationale: >
      Query without KeyConditionExpression degenerates toward a scan over
      the partition — the declared kwargs carry no key condition.
    remediation: "Pass KeyConditionExpression with the partition key (and sort key when modeled)."
    reference: "https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Query.html"
    runtime_scope: "dynamodb"
    check:
      kind: data.dynamo.operation
      path: measures.query_without_key_condition
      op: eq
      value: true
  - id: AF-DATA-011
    title: "MongoDB find/aggregate without a limit"
    severity: medium
    rationale: >
      An unbounded find or aggregation returns the whole result set into
      the application — memory and latency scale with the collection.
      The rule fires only when no limit()/batch_size() bounds the call.
    remediation: "Pass limit= or chain .limit(n); paginate with a cursor or $skip/$limit in the pipeline."
    reference: "https://www.mongodb.com/docs/manual/reference/method/cursor.limit/"
    runtime_scope: "mongodb|documentdb"
    check:
      kind: data.mongo.operation
      path: measures.unbounded_find
      op: eq
      value: true
  - id: AF-DATA-012
    title: "MongoDB filtered write with an empty filter"
    severity: critical
    rationale: >
      delete_many({}), update_many({}, ...) or an empty Document() filter
      match every document in the collection — a mass write/delete from
      application code.
    remediation: "Require a non-empty filter literal; gate legitimate mass operations behind an operational runbook."
    reference: "https://www.mongodb.com/docs/manual/reference/method/db.collection.deleteMany/"
    runtime_scope: "mongodb|documentdb"
    check:
      kind: data.mongo.operation
      path: measures.unfiltered_write
      op: eq
      value: true
  - id: AF-DATA-013
    title: "Neptune traversal/query without a limit"
    severity: medium
    rationale: >
      g.V()/g.E() with no .limit()/.range() on the chain, or an
      openCypher/SPARQL string without LIMIT, returns an unbounded graph
      result — memory cost scales with the graph.
    remediation: "Bound traversals with .limit(n)/.range(a,b) and add LIMIT to query strings."
    reference: "https://docs.aws.amazon.com/neptune/latest/userguide/access-graph-gremlin.html"
    runtime_scope: "neptune"
    check:
      kind: data.neptune.query
      path: measures.unbounded
      op: eq
      value: true
