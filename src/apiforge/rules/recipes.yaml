version: 1
# Recipes are data: each maps to an ordered list of dispatchable verbs.
# A step runs only when the task's inputs bind everything the verb needs;
# otherwise it stays pending with the missing inputs named.
recipes:
  direct:
    - rules list
  test-first:
    - discover
    - model build
    - judge
    - evidence emit
  plan-execute-verify:
    - discover
    - analyze
    - judge
    - next-step
    - evidence emit
    - report build
  diagnose-repair-verify:
    - analyze
    - judge
    - next-step
  research-synthesize-verify:
    - rules list
    - context funnel
    - report build
  # Mutation recipe: `build endpoint` writes only into the task's sandbox
  # copy (.apiforge/sandbox) and never promotes — promotion stays a human
  # act. The task runner policy-gates the step: the declared class is
  # local_reversible and writable_paths must cover .apiforge.
  build-endpoint:
    - model build
    - build endpoint
    - evidence emit
