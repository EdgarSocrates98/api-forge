permissions:
  mcp-gateway:
    allowed_tools:
      - apiforge_discover
      - apiforge_call
      - apiforge_context
      - apiforge_expand
      - apiforge_analyze
      - apiforge_evidence
    allowed_risk_classes: [read_only]
    allowed_targets: ["*"]
    denied_tools: []
    notes: compact MCP boundary; full tool policy remains explicit
  api-orchestrator:
    allowed_tools: [agent-invocation]
    allowed_risk_classes: [read_only]
    denied_tools: []
    delegates_to: [specialist, reviewer, critic, referee, runner]
    notes: runtime adapter admission; undeclared requested tools fail closed
  specialist:
    allowed_tools:
      - context_capsule
      - context_quality
      - memory_propose
      - memory_query
      - blackboard_append
      - blackboard_query
    allowed_risk_classes: [read_only, write]
    denied_tools: [k6]
    notes: reads and proposes; may append working data, never promote memory
  reviewer:
    allowed_tools:
      - context_capsule
      - context_quality
      - memory_propose
      - memory_query
      - memory_invalidate
      - memory_quarantine_resolve
      - blackboard_append
      - blackboard_query
      - semgrep
      - trivy
      - gitleaks
    allowed_risk_classes: [read_only, write, security_impact]
    denied_tools: [k6]
    notes: reviews and curates; may resolve quarantine with a named reviewer
  critic:
    allowed_tools:
      - context_capsule
      - context_quality
      - memory_query
      - blackboard_query
    allowed_risk_classes: [read_only]
    denied_tools: [memory_persist, k6]
    notes: adversarial read-only analysis; proposes nothing, mutates nothing
  referee:
    allowed_tools:
      - context_capsule
      - context_quality
      - memory_query
      - blackboard_query
    allowed_risk_classes: [read_only]
    denied_tools: [memory_persist, memory_quarantine_resolve, k6]
    notes: rules on disputes from evidence only; no state mutation
  runner:
    allowed_tools: [semgrep, trivy, gitleaks, k6]
    allowed_risk_classes: [read_only, security_impact, external_side_effect, production_impact]
    denied_tools: [memory_persist, memory_quarantine_resolve]
    notes: executes allowlisted local binaries; load targets still need the policy gate
