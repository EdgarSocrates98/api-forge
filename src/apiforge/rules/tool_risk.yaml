# Tool risk profiles and agent permission sets (step11 §13).
#
# Every callable surface carries a declared risk profile; every agent role is
# authorized against an explicit allowlist. Authorization is default-deny:
# a tool not named in allowed_tools, carrying a risk class outside
# allowed_risk_classes, or named in denied_tools is refused with an AF code.
schema: apiforge/tool-risk/v1
tools:
  semgrep:
    risk_classes: [read_only]
    reversible: true
    notes: local SAST scan; writes only the report artifact
  trivy:
    risk_classes: [read_only]
    reversible: true
    notes: filesystem/image scan; vulnerability db fetched by the tool itself
  gitleaks:
    risk_classes: [read_only, security_impact]
    reversible: true
    notes: secret scan output may contain partial secret material — treat as sensitive
  k6:
    risk_classes: [external_side_effect, production_impact]
    reversible: false
    notes: executes real HTTP calls against its target; gated by the load-target policy
  context_capsule:
    risk_classes: [read_only]
    reversible: true
    notes: builds a context projection; no mutation
  context_quality:
    risk_classes: [read_only]
    reversible: true
    notes: ledger-derived measurement; no mutation
  memory_propose:
    risk_classes: [write]
    reversible: true
    notes: appends a candidate row; never persists truth
  memory_persist:
    risk_classes: [write, security_impact]
    reversible: true
    notes: promotes candidate to the immutable record log through the gate pipeline
  memory_query:
    risk_classes: [read_only]
    reversible: true
    notes: bounded retrieval with freshness diagnostics
  memory_invalidate:
    risk_classes: [write]
    reversible: true
    notes: append-only invalidation event; never deletes
  memory_quarantine_resolve:
    risk_classes: [write, security_impact]
    reversible: true
    notes: human review boundary that can persist or reject a quarantined candidate
  blackboard_append:
    risk_classes: [write]
    reversible: true
    notes: append-only shared-state entry
  blackboard_query:
    risk_classes: [read_only]
    reversible: true
    notes: bounded query over one task scope
  apiforge_discover:
    risk_classes: [read_only]
    reversible: true
    notes: compact MCP discovery projection
  apiforge_call:
    risk_classes: [read_only]
    reversible: true
    notes: compact MCP dispatch boundary; inner tools retain local policy gates
  apiforge_context:
    risk_classes: [read_only]
    reversible: true
    notes: compact context projection
  apiforge_expand:
    risk_classes: [read_only]
    reversible: true
    notes: verified context reference expansion
  apiforge_analyze:
    risk_classes: [read_only]
    reversible: true
    notes: deterministic local analysis and case artifact generation
  apiforge_evidence:
    risk_classes: [read_only]
    reversible: true
    notes: evidence projection
  agent-invocation:
    risk_classes: [read_only]
    reversible: true
    notes: governed runtime adapter boundary; declared tool_names are checked separately
  agent_span_append:
    risk_classes: [write]
    reversible: true
