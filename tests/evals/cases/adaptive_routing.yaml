    mandatory: true
  - id: adaptive-routing-adversarial
    domain: routing
    input: fixtures/routing/adversarial.json
    expected: BLOCKED
    required_evidence: [adversarial-refusal]
    mutation: forged-evidence
    quality_axes: [provenance]
    kind: adversarial
    mandatory: true
