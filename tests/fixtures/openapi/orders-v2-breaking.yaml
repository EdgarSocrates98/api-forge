openapi: 3.1.0
info:
  title: Orders API
  version: 2.0.0
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    Order:
      type: object
      required: [id, total, note]
      properties:
        id:
          type: string
        total:
          type: number
        note:
          type: string
        status:
          type: string
